name: test matrix flow
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      environment:
        description: 'Environment to run tests against'
        required: true
        type: environment
jobs:
  my_matrix_example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [10, 12]
        os: [ubuntu-latest, windows-latest]
    steps: 
     - run: echo "testing ${{inputs.environment}}"
     - run: |
         echo "Matrix info: ${{ matrix.version }} and ${{ matrix.os }}"
         
